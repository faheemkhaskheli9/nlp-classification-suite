[project]
name = "nlp-classification-suite"
version = "0.1.0"
description = "NLP Classification Suite -- insincere-question detection + multilingual sentiment analysis, selectable from one dashboard"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3,<2",
    "joblib>=1.3,<2",
    "transformers>=4.38",
    "torch>=2.1",
    "fastapi>=0.108",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
nlp-suite = "nlp_suite.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
